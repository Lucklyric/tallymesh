[profile.default]
src = "src"
memory_limit = 1073741824
gas_limit = 9223372036854775807
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = false
verbosity = 2
ffi = true
fs_permissions = [
  { access = "read-write", path = "../sdk-ts" },
  { access = "read-write", path = "./eval/data/raw" },
  { access = "read-write", path = "./eval/data/derived" },
]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 64
fail_on_revert = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
